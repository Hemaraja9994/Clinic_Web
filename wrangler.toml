# Cloudflare Pages configuration for the clinic website + admin.
# See docs/ADMIN_SETUP.md for the one-time setup steps.
name = "sri-rudra-speech-hearing-clinic"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "sri-rudra-clinic-web-db"
# D1 database "sri-rudra-clinic-web-db" (APAC) in the clinic Cloudflare account.
# Do NOT point this at "sri-rudra-portal-db" - that belongs to the old staff portal.
database_id = "b811c4b8-3077-41d3-ada0-a7ebe85723d8"
migrations_dir = "migrations"

# The clinic's main staff portal database (admin.srirudraspeechandhearing.com).
# Used ONLY by the public booking form, which inserts rows into its appointments table.
[[d1_databases]]
binding = "PORTAL_DB"
database_name = "sri-rudra-portal-db"
database_id = "81888080-d782-4f47-adab-a26b68afb6ba"
